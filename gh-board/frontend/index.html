<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitHub Triage Desktop</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 flex h-screen font-sans relative">

  <!-- Sidebar -->
  <aside class="w-80 border-r border-gray-800 p-4 flex flex-col gap-4">
    <!-- Auth Section -->
    <div id="authSection" class="space-y-2">
      <button id="loginBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2 rounded text-sm transition flex items-center justify-center gap-2">
        <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
        Sign in with GitHub
      </button>
    </div>

    <!-- User Info & Action (Hidden by default) -->
    <div id="userSection" class="hidden space-y-2">
      <div class="bg-gray-900 border border-gray-800 rounded p-2 flex items-center justify-between text-xs">
        <span id="authStatus" class="text-emerald-400 font-medium">✓ Authenticated</span>
        <button id="logoutBtn" class="text-gray-500 hover:text-gray-300">Sign out</button>
      </div>
      <button id="fetchBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-1.5 rounded text-sm transition">Refresh Repos</button>
    </div>

    <!-- Filter Control -->
    <div class="space-y-1">
      <label class="text-xs uppercase font-bold text-gray-400">Filter</label>
      <select id="visibilityFilter" class="w-full bg-gray-900 border border-gray-700 rounded px-2 py-1 text-sm text-gray-300 focus:outline-none">
        <option value="all">Show All</option>
        <option value="public">Public Only</option>
        <option value="private">Private Only</option>
      </select>
    </div>

    <!-- Logs -->
    <div class="flex-1 flex flex-col min-h-0">
      <span class="text-xs uppercase font-bold text-gray-400 mb-1">Activity Log</span>
      <div id="logs" class="flex-1 bg-gray-900 border border-gray-800 rounded p-2 text-xs font-mono overflow-y-auto space-y-1 text-gray-300">
        <p class="text-gray-500">// Desktop app ready.</p>
      </div>
    </div>
  </aside>

  <!-- Main Table -->
  <main class="flex-1 flex flex-col p-6 overflow-hidden">
    <div class="flex justify-between items-center mb-4">
      <h1 class="text-xl font-bold">Repositories (<span id="repoCount">0</span>)</h1>
      <div id="bulkActions" class="hidden flex gap-2">
        <button id="bulkPrivateBtn" class="bg-amber-600 hover:bg-amber-500 text-white px-3 py-1.5 rounded text-xs font-medium transition">Make Selected Private</button>
        <button id="bulkPublicBtn" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded text-xs font-medium transition">Make Selected Public</button>
      </div>
    </div>

    <div class="flex-1 overflow-y-auto border border-gray-800 rounded-lg">
      <table class="w-full text-left text-sm">
        <thead class="bg-gray-900 text-gray-400 sticky top-0 border-b border-gray-800">
          <tr>
            <th class="p-3 w-10"><input type="checkbox" id="selectAll" /></th>
            <th class="p-3">Name</th>
            <th class="p-3">Status</th>
            <th class="p-3">Stars</th>
            <th class="p-3">Updated</th>
            <th class="p-3 text-right">Quick Toggle</th>
          </tr>
        </thead>
        <tbody id="repoTableBody" class="divide-y divide-gray-800"></tbody>
      </table>
    </div>
  </main>

  <!-- Device Flow Verification Modal -->
  <div id="authModal" class="hidden absolute inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
    <div class="bg-gray-900 border border-gray-800 rounded-lg p-6 max-w-sm w-full text-center space-y-4 shadow-2xl">
      <h2 class="text-lg font-bold text-white">Authorize Application</h2>
      <p class="text-xs text-gray-400">Copy this code and verify it in your browser:</p>
      
      <div class="bg-gray-950 border border-gray-800 rounded py-3 px-4 flex items-center justify-center gap-3">
        <span id="userCodeDisplay" class="font-mono text-2xl font-bold tracking-widest text-blue-400">----</span>
      </div>

      <div class="space-y-2">
        <button id="openBrowserBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2 rounded text-sm transition">
          Open Verification Page
        </button>
        <p class="text-[11px] text-gray-500 animate-pulse">Waiting for browser authorization...</p>
      </div>
    </div>
  </div>

  <script type="module" src="./src/main.ts"></script>
</body>
</html>
